name: supratimz_portfolio
description: "Supratim's Portfolio - A premium developer portfolio website"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  http: ^1.2.1
  google_fonts: ^6.2.1
  url_launcher: ^6.2.6
  visibility_detector: ^0.4.0+2
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/project/
    - assets/images/projects/
